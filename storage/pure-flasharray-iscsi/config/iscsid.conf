# /etc/iscsi/iscsid.conf for KVM hosts attached to Pure FlashArray.
# Only the values that differ from the open-iscsi defaults are listed.

# Log in to known targets automatically at boot.
node.startup = automatic

# With dm-multipath, fail a dead path fast so I/O moves to the other paths.
# Default is 120s, which stalls guest I/O for two minutes on a single link failure.
node.session.timeo.replacement_timeout = 15

# Login and logout timeouts.
node.conn[0].timeo.login_timeout = 15
node.conn[0].timeo.logout_timeout = 15

# NOP-out keepalives: detect a dead connection within ~10s.
node.conn[0].timeo.noop_out_interval = 5
node.conn[0].timeo.noop_out_timeout = 5

# Queue depth per session.
node.session.queue_depth = 128
node.session.cmds_max = 1024
