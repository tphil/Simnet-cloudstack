# /etc/multipath.conf for KVM hosts attached to Pure FlashArray over iSCSI.
# Device section follows Pure's published Linux recommended settings.
defaults {
    user_friendly_names no
    find_multipaths     yes
    polling_interval    10
}

blacklist {
    devnode "^(ram|raw|loop|fd|md|dm-|sr|scd|st|nvme)[0-9]*"
    devnode "^sd[a]$"
}

devices {
    device {
        vendor               "PURE"
        product              "FlashArray"
        path_selector        "queue-length 0"
        path_grouping_policy group_by_prio
        path_checker         tur
        fast_io_fail_tmo     10
        dev_loss_tmo         60
        no_path_retry        0
        hardware_handler     "1 alua"
        prio                 alua
        failback             immediate
    }
}
